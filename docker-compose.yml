# Copy `./backend/.env.example` → `./backend/.env` and add `EMAIL_PASS` (or export it in your shell).
# The `api` service tolerates a missing `./backend/.env`, but SMTP will fail until credentials exist.
name: qubix-solutions

services:
  # ---------------------------------------------------------------------------
  # init-certs
  # Runs once on `docker compose up`. If no SSL certs exist yet (first boot),
  # generates self-signed dummies so Nginx can start successfully.
  # `scripts/enable-ssl.sh` will replace them with real Let's Encrypt certs.
  # ---------------------------------------------------------------------------
  init-certs:
    image: alpine:3.20
    container_name: qubix-init-certs
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    environment:
      DOMAIN: ${SSL_DOMAIN:-qubixsolution.com}
    command: >
      sh -c '
        set -e;
        DOMAIN=$${DOMAIN};
        CERT_DIR="/etc/letsencrypt/live/$$DOMAIN";
        if [ ! -f "$$CERT_DIR/fullchain.pem" ]; then
          echo "[init-certs] generating self-signed dummy certificate for $$DOMAIN";
          apk add --no-cache openssl >/dev/null;
          mkdir -p "$$CERT_DIR";
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj "/CN=$$DOMAIN" \
            -keyout "$$CERT_DIR/privkey.pem" \
            -out    "$$CERT_DIR/fullchain.pem" >/dev/null 2>&1;
          echo "[init-certs] dummy certificate ready. Run scripts/enable-ssl.sh next.";
        else
          echo "[init-certs] certificate already present — nothing to do.";
        fi;
        mkdir -p /var/www/certbot;
      '
    restart: "no"

  # ---------------------------------------------------------------------------
  # web — Next.js app (standalone build)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: qubix-solutions/web:latest
    container_name: qubix-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      CONTACT_BACKEND_URL: http://api:8000/contact
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://qubixsolution.com}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-support@qubixsolution.com}
    expose:
      - "3000"
    networks:
      - qubix-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # api — FastAPI SMTP contact relay
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: qubix-solutions/api:latest
    container_name: qubix-api
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      SMTP_HOST: smtp.hostinger.com
      SMTP_PORT: "587"
      EMAIL_USER: support@qubixsolution.com
      # Comma-separated. Override in shell or `./backend/.env` if needed.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://qubixsolution.com,https://www.qubixsolution.com,http://localhost:3000,http://127.0.0.1:3000}
      # Used in outbound lead emails (“open your contact page” link — no trailing slash).
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://qubixsolution.com}
    expose:
      - "8000"
    networks:
      - qubix-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # nginx — TLS terminator + reverse proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: qubix-nginx
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      init-certs:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/tls:/etc/nginx/tls:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - qubix-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # certbot — auto-renews the SSL certificate every 12h
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: qubix-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done;'

networks:
  qubix-net:
    driver: bridge
