upstream qubix_web {
    server web:3000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP -> HTTPS redirect (and ACME challenge passthrough)
# ---------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name qubixsolution.com www.qubixsolution.com;

    # Healthcheck (used by docker)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Force HTTPS for everything else
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — main site
# ---------------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name qubixsolution.com www.qubixsolution.com;

    # ---- SSL ----
    ssl_certificate     /etc/letsencrypt/live/qubixsolution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qubixsolution.com/privkey.pem;

    ssl_session_timeout       1d;
    ssl_session_cache         shared:MozSSL:10m;
    ssl_session_tickets       off;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP stapling
    ssl_stapling          on;
    ssl_stapling_verify   on;
    resolver              1.1.1.1 8.8.8.8 valid=60s;
    resolver_timeout      5s;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ---- Redirect www -> apex ----
    if ($host = www.qubixsolution.com) {
        return 301 https://qubixsolution.com$request_uri;
    }

    # ---- Healthcheck ----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ---- Static assets — cache hard ----
    location /_next/static/ {
        proxy_pass http://qubix_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    location ~* \.(svg|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp|avif)$ {
        proxy_pass http://qubix_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=2592000";
        expires 30d;
        access_log off;
    }

    # ---- API rate limiting ----
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://qubix_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }

    # ---- App ----
    location / {
        limit_req zone=site_limit burst=50 nodelay;
        proxy_pass http://qubix_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_buffering on;
        proxy_buffer_size       16k;
        proxy_buffers        8  16k;
        proxy_busy_buffers_size 32k;
    }

    # Block access to dotfiles
    location ~ /\.(?!well-known) {
        deny all;
    }
}
