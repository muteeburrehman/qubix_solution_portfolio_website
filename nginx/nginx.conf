user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main buffer=32k flush=5s;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout    65;
    keepalive_requests   1000;
    client_max_body_size 10m;
    client_body_timeout  20s;
    client_header_timeout 20s;
    reset_timedout_connection on;

    # Gzip
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # Brotli (uncomment if module is installed)
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/json application/javascript application/xml+rss text/javascript image/svg+xml;

    # Real IP from upstream proxy / Cloudflare
    real_ip_header     X-Forwarded-For;
    set_real_ip_from   10.0.0.0/8;
    set_real_ip_from   172.16.0.0/12;
    set_real_ip_from   192.168.0.0/16;

    # Rate limiting zones
    limit_req_zone  $binary_remote_addr zone=site_limit:10m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=api_limit:10m  rate=10r/s;

    proxy_connect_timeout  10s;
    proxy_send_timeout     30s;
    proxy_read_timeout     30s;

    map $sent_http_content_type $expires {
        default                    off;
        ~image/                    7d;
        ~video/                    30d;
        ~font/                     365d;
        application/font-woff2     365d;
        application/javascript     30d;
        text/css                   30d;
    }

    include /etc/nginx/conf.d/*.conf;
}
