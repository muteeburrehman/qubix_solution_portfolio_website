<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="100%" stop-color="#0b0d1f"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <g transform="translate(80, 80)">
    <rect width="64" height="64" rx="14" fill="url(#brand)"/>
    <g transform="translate(12, 12)" fill="none" stroke="white" stroke-linejoin="round" stroke-linecap="round">
      <path d="M4 14L20 6l16 8v16L20 38 4 30V14z" stroke-width="2.5"/>
      <path d="M20 6v32M4 14l16 8 16-8M4 30l16-8 16 8" stroke-width="1.6" opacity="0.7"/>
    </g>
    <text x="80" y="28" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="700" fill="white">Qubix</text>
    <text x="80" y="52" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.6)" letter-spacing="3">SOLUTIONS</text>
  </g>

  <g transform="translate(80, 240)">
    <text font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="76" font-weight="800" fill="white" letter-spacing="-2">
      <tspan x="0" y="0">We build AI products,</tspan>
      <tspan x="0" y="92">web platforms &amp;</tspan>
      <tspan x="0" y="184" fill="url(#brand)">e-commerce that ship.</tspan>
    </text>
  </g>

  <g transform="translate(80, 540)" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="rgba(255,255,255,0.7)">
    <text font-size="22" font-weight="500">AI · LLM · Chatbots · n8n · React · Angular · Flutter · Shopify · WordPress</text>
  </g>

  <g transform="translate(1040, 540)" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="white" text-anchor="end">
    <text font-size="22" font-weight="700">qubixsolution.com</text>
  </g>
