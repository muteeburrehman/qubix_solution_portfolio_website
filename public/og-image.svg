    <g transform="translate(12, 12)" fill="none" stroke="white" stroke-linejoin="round" stroke-linecap="round">
      <path d="M4 14L20 6l16 8v16L20 38 4 30V14z" stroke-width="2.5"/>
      <path d="M20 6v32M4 14l16 8 16-8M4 30l16-8 16 8" stroke-width="1.6" opacity="0.85"/>
    </g>
    <text x="80" y="28" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="700" fill="#0f2744">Qubix</text>
    <text x="80" y="52" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="rgba(15,39,68,0.55)" letter-spacing="3">SOLUTIONS</text>
  </g>

  <g transform="translate(80, 240)">
    <text font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="74" font-weight="800" fill="#0f2744" letter-spacing="-2">
      <tspan x="0" y="0">We provide solutions</tspan>
      <tspan x="0" y="90" fill="url(#brand)">for web, mobile &amp; commerce.</tspan>
