  <g transform="translate(80, 540)" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="rgba(15,39,68,0.62)">
    <text font-size="21" font-weight="500">Django &#183; FastAPI &#183; React &#183; Angular &#183; Express &#183; RDS &#183; Shopify</text>
